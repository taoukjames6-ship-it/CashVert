[tool.briefcase]
project_name = "CashVert"
bundle = "com.james.cashvert"
version = "0.0.1"
url = "https://github.com"
license = "BSD-3-Clause"
author = "James Taouk"
author_email = "james@example.com"

[tool.briefcase.app.cashvert]
formal_name = "CashVert"
description = "A simple currency and unit converter built with BeeWare."
# The Python module that contains your `main()` function and app class:
module = "CashVert"
# The class that subclasses toga.App in that module:
app_class = "ConverterApp"
# Point to your source file (or a src/ directory). Here the file is CashVert.py:
sources = ["CashVert.py"]
# Runtime requirements:
requires = [
    "toga>=0.3.0",
    "toga-ios>=0.3.0",
    "requests"
]

[tool.briefcase.app.cashvert.iOS]
# Uses the standard iOS template (default)
template = "Xcode"
